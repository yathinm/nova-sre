name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server-go: ${{ steps.filter.outputs.server-go }}
      agent-python: ${{ steps.filter.outputs.agent-python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server-go:
              - '.github/workflows/ci.yml'
              - 'server-go/**'
              - 'Makefile'
            agent-python:
              - '.github/workflows/ci.yml'
              - 'agent-python/**'
              - 'Makefile'
            frontend:
              - '.github/workflows/ci.yml'
              - 'frontend/**'

  server-go:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.server-go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: server-go/go.sum

      - name: Run tests
        run: go test ./...

  agent-python:
    name: Python agent tests
    needs: changes
    if: needs.changes.outputs.agent-python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-python/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
