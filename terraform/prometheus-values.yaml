# Helm values for the local Minikube Prometheus release.
server:
  persistentVolume:
    enabled: true
    size: 8Gi
  retention: "15d"
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      - job_name: nova-sre-server
        metrics_path: /metrics
        static_configs:
          - targets:
              - nova-sre-server.nova-sre.svc.cluster.local:8080
            labels:
              app: nova-sre-server
              namespace: nova-sre
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
