apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova-sre-server
  namespace: nova-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-sre-server
  namespace: nova-sre
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-sre-server
  namespace: nova-sre
subjects:
  - kind: ServiceAccount
    name: nova-sre-server
    namespace: nova-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-sre-server
