apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-sre-agent
  namespace: nova-sre
  labels:
    app: nova-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-sre-agent
  template:
    metadata:
      labels:
        app: nova-sre-agent
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: nova-sre-agent:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nova-sre-secrets
                  key: OPENAI_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nova-sre-secrets
                  key: GITHUB_TOKEN
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
