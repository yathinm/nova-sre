apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-sre-server
  namespace: nova-sre
  labels:
    app: nova-sre-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-sre-server
  template:
    metadata:
      labels:
        app: nova-sre-server
    spec:
      serviceAccountName: nova-sre-server
      containers:
        - name: server
          image: nova-sre-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
