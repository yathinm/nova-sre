apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-sre-server
  namespace: nova-sre
  labels:
    app: nova-sre-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-sre-server
  template:
    metadata:
      labels:
        app: nova-sre-server
    spec:
      serviceAccountName: nova-sre-server
      containers:
        - name: server
          image: nova-sre-server:local
          imagePullPolicy: Never
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: nova-sre-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nova-sre-secrets
                  key: GITHUB_TOKEN
            - name: NOVA_SRE_AGENT_URL
              value: http://nova-sre-agent.nova-sre.svc.cluster.local:8000
            - name: RUNNER_JOB_TTL_SECONDS
              value: "900"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
