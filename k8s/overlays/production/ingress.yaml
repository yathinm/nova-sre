apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova-sre
  namespace: nova-sre
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nova-sre.example.com
      secretName: nova-sre-tls
  rules:
    - host: nova-sre.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nova-sre-server
                port:
                  number: 8080
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: nova-sre-server
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: nova-sre-server
                port:
                  number: 8080
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: nova-sre-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova-sre-frontend
                port:
                  number: 80
